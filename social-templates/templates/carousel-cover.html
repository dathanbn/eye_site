<article class="post {{tone}} carousel-cover {{size}}">
{{>motif}}
  <div class="rule"></div>
  <div class="eyebrow">{{eyebrow}}</div>
  <h1 class="headline">{{headline}}</h1>
  {{#body}}<p class="body">{{body}}</p>{{/body}}
  <div class="foot">
    <span class="tile"><img class="logo" src="assets/eye-site-logo-transparent.png" alt="Eye Site Sacramento"></span>
    <span class="swipe">Swipe <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </div>
</article>
