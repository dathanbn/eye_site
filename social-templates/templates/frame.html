<article class="post light frame {{size}}{{#nologo}} nologo{{/nologo}}" style="--focus: {{focus}}">
{{>motif}}
  <div class="top">
    <div class="eyebrow">{{eyebrow}}</div>
    {{#count}}<div class="count">{{count}}</div>{{/count}}
  </div>
  <img class="pic" src="{{image}}" alt="">
  {{#caption}}<h2 class="caption">{{caption}}</h2>{{/caption}}
  {{#sub}}<p class="sub">{{sub}}</p>{{/sub}}
  <div class="foot">
    <img class="logo" src="assets/eye-site-logo-transparent.png" alt="Eye Site Sacramento">
    {{#nologo}}<img class="mark" src="assets/eye-site-mark.png" alt="">{{/nologo}}
    <span class="site">eyesitemd.com</span>
  </div>
</article>
