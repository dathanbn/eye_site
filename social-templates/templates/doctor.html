<article class="post light doctor {{size}}" style="--focus: {{focus}}">
  <div class="portrait"><img src="{{image}}" alt=""></div>
  <div class="panel">
{{>motif}}
    <div class="eyebrow">{{eyebrow}}</div>
    <h1 class="name {{nameClass}}">{{name}}</h1>
    <div class="role">{{role}}</div>
    <div class="divider"></div>
    <div class="accolade">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></svg>
      <div>{{accolade}}{{#accoladeSource}}<small>{{accoladeSource}}</small>{{/accoladeSource}}</div>
    </div>
    {{#chip}}<span class="chip">{{chip}}</span>{{/chip}}
    <div class="foot">
      <img class="logo" src="assets/eye-site-logo-transparent.png" alt="Eye Site Sacramento">
      <span class="site">eyesitemd.com</span>
    </div>
  </div>
</article>
