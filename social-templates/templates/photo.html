<article class="post dark photo {{size}}" style="--focus: {{focus}}">
  <img class="bg desat" src="{{image}}" alt="">
  <div class="overlay"></div>
  <div class="content">
    <div class="rule"></div>
    <div class="eyebrow">{{eyebrow}}</div>
    <h1 class="headline">{{headline}}</h1>
    {{#body}}<p class="body">{{body}}</p>{{/body}}
    {{#chip}}<span class="chip">{{chip}}</span>{{/chip}}
  </div>
  <div class="foot">
    <span class="tile"><img class="logo" src="assets/eye-site-logo-transparent.png" alt="Eye Site Sacramento"></span>
    <span class="site">eyesitemd.com</span>
  </div>
</article>
