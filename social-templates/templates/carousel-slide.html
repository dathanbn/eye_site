<article class="post light slide {{size}}">
{{>motif}}
  <div class="top">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="right"><div class="count">{{index}} / {{total}}</div><img class="mark" src="assets/eye-site-mark.png" alt=""></div>
  </div>
  <div class="num">{{index}}</div>
  <h2 class="headline">{{headline}}</h2>
  <p class="body">{{body}}</p>
  <div class="foot">
    <div class="progress">{{progress}}</div>
    <div class="row">
      <span class="site">eyesitemd.com</span>
      <span class="count">{{footerNote}}</span>
    </div>
  </div>
</article>
