<article class="post dark announcement {{size}}">
{{>motif}}
  <div class="rule"></div>
  <div class="eyebrow">{{eyebrow}}</div>
  <h1 class="headline">{{headline}}</h1>
  <p class="body">{{body}}</p>
  {{#phone}}<div class="phones"><div class="phone"><small>{{phoneLabel}}</small>{{phone}}</div>{{#phone2}}<div class="phone"><small>{{phoneLabel2}}</small>{{phone2}}</div>{{/phone2}}</div>{{/phone}}
  <div class="foot">
    <span class="tile"><img class="logo" src="assets/eye-site-logo-transparent.png" alt="Eye Site Sacramento"></span>
    <span class="site">eyesitemd.com</span>
  </div>
</article>
