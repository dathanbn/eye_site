<article class="post light education {{size}}{{#image}} has-image{{/image}}" style="--focus: {{focus}}">
{{>motif}}
  {{#image}}<img class="band" src="{{image}}" alt="">{{/image}}
  <div class="rule"></div>
  <div class="eyebrow">{{eyebrow}}</div>
  <h1 class="headline">{{headline}}</h1>
  <p class="body">{{body}}</p>
  {{#chip}}<span class="chip">{{chip}}</span>{{/chip}}
  <div class="foot">
    <img class="logo" src="assets/eye-site-logo-transparent.png" alt="Eye Site Sacramento">
    <span class="site">eyesitemd.com</span>
  </div>
</article>
