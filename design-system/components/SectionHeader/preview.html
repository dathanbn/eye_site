<!-- @dsCard group="Content" height=236 subtitle="Eyebrow, serif heading and lead paragraph that open every section" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SectionHeader preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--ink); background: var(--canvas); }
  .section-header { max-width: 640px; padding: var(--space-8) var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); }
  .eyebrow { font: 500 12px/1.2 var(--font-sans); letter-spacing: 0.2em; text-transform: uppercase; color: var(--blue); }
  .h2 { font: 400 36px/1.15 var(--font-serif); letter-spacing: -0.015em; color: var(--ink); margin: 0; text-wrap: balance; }
  .lead { font: 300 21px/1.55 var(--font-sans); color: var(--slate); margin: 0; max-width: 65ch; }
</style>
</head>
<body>
  <header class="section-header">
    <span class="eyebrow">Our specialties</span>
    <h2 class="h2">From routine exams to advanced cataract surgery</h2>
    <p class="lead">Five board-certified surgeons and two optometrists, serving Sacramento and Folsom with everything from eyeglass prescriptions to the Light Adjustable Lens.</p>
  </header>
</body>
</html>
