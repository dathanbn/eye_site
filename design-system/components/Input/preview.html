<!-- @dsCard group="Forms" height=330 subtitle="The appointment request form fields: text, tel, email, selects and a textarea, with an error state" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Input preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style> body::before { display: none; } body { background: var(--surface); padding: 24px; } </style>
</head>
<body>
  <form class="form" onsubmit="return false">
    <div class="field"><label for="first">First name <em>(required)</em></label><input class="control" id="first" placeholder="Maria"><span class="help"></span></div>
    <div class="field"><label for="phone">Phone <em>(required)</em></label><input class="control" id="phone" type="tel" placeholder="916-555-0100"><span class="help">We call to confirm your appointment</span></div>
    <div class="field is-error"><label for="email">Email</label><input class="control" id="email" type="email" value="maria@example" aria-invalid="true"><span class="help">Enter a full email address, like maria@example.com.</span></div>
    <div class="field"><label for="office">Preferred office</label><select class="control" id="office"><option>Sacramento, 4925 J Street</option><option>Folsom, 2160 E Bidwell Street</option></select><span class="help"></span></div>
    <div class="field wide"><label for="notes">Anything we should know</label><textarea class="control" id="notes" placeholder="Current symptoms, a referring doctor, or questions for your visit" style="min-height: 90px"></textarea><span class="help">Please do not include medical record numbers or insurance ID numbers here.</span></div>
  </form>
</body>
</html>
