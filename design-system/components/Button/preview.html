<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Button preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  body::before { display: none; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding: var(--space-6); }
  .row.hero { position: relative; isolation: isolate; min-height: 0; display: flex; align-items: center; }
  .row.hero .bg { position: absolute; inset: 0; z-index: -2; }
</style>
</head>
<body>
  <div class="row">
    <a class="btn btn-primary" href="#">Schedule Appointment</a>
    <a class="btn btn-secondary" href="#">Meet the doctors</a>
    <a class="link" href="#">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
  <div class="row hero">
    <div class="bg"><img src="../../assets/Photography/hero-sacramento.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:60% 58%"></div>
    <a class="btn btn-primary" href="#">Schedule Appointment</a>
    <a class="btn btn-secondary" href="#">Meet the doctors</a>
    <a class="link" href="#" style="color:#fff;box-shadow:inset 0 -1px 0 rgba(179,207,234,0.5)">Our specialties <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</body>
</html>
