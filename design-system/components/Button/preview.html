<!-- @dsCard group="Actions" height=232 subtitle="Primary amber, secondary outline, text button, and the on-navy variants" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Button preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--ink); background: var(--canvas); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding: var(--space-6); }
  .row.dark { background: var(--navy); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    height: 48px; padding: 0 var(--space-6); border-radius: var(--radius-pill);
    font: 500 13px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; cursor: pointer;
    border: 1.5px solid transparent;
    transition: transform 160ms cubic-bezier(0.2,0,0,1), background-color 120ms cubic-bezier(0.2,0,0,1), border-color 120ms cubic-bezier(0.2,0,0,1), color 120ms cubic-bezier(0.2,0,0,1);
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn-primary { background: var(--amber); color: var(--on-amber); }
  .btn-secondary { background: transparent; color: var(--blue); border-color: var(--blue); }
  .btn-text { background: transparent; color: var(--blue); padding: 0 var(--space-1); height: auto; border-radius: 0; box-shadow: inset 0 -2px 0 transparent; }
  .dark .btn-secondary { color: var(--on-navy); border-color: var(--mist); }
  .dark .btn-text { color: var(--on-navy); }
  .btn[aria-disabled="true"] { opacity: 0.4; cursor: default; pointer-events: none; }
  @media (hover: hover) and (pointer: fine) {
    .btn-primary:hover { background: var(--amber-deep); }
    .btn-secondary:hover { background: var(--ice); }
    .dark .btn-secondary:hover { background: rgba(179,207,234,0.14); }
    .btn-text:hover { box-shadow: inset 0 -2px 0 var(--amber); }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: background-color 120ms, border-color 120ms, color 120ms; } .btn:active { transform: none; } }
  .btn svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div class="row">
    <a class="btn btn-primary" href="#">Schedule Appointment</a>
    <a class="btn btn-secondary" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      Call Sacramento Office
    </a>
    <a class="btn btn-text" href="#">Learn about LASIK</a>
    <a class="btn btn-primary" href="#" aria-disabled="true">Schedule Appointment</a>
  </div>
  <div class="row dark">
    <a class="btn btn-primary" href="#">Schedule Appointment</a>
    <a class="btn btn-secondary" href="#">Call Folsom Office</a>
    <a class="btn btn-text" href="#">See all locations</a>
  </div>
</body>
</html>
