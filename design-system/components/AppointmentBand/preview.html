<!-- @dsCard group="Bands" height=320 subtitle="The navy closing panel with both offices and the one amber button" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AppointmentBand preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--ink); background: var(--canvas); padding: var(--space-6); }
  .band { background: var(--navy); color: var(--on-navy); border-radius: var(--radius-lg); padding: var(--space-12); display: grid; grid-template-columns: 1.3fr 1fr; gap: var(--space-12); align-items: center; }
  .eyebrow { font: 500 12px/1.2 var(--font-sans); letter-spacing: 0.2em; text-transform: uppercase; color: var(--mist); display: block; margin-bottom: var(--space-3); }
  .h2 { font: 400 36px/1.15 var(--font-serif); letter-spacing: -0.015em; margin: 0 0 var(--space-6); text-wrap: balance; }
  .btn { display: inline-flex; align-items: center; height: 48px; padding: 0 var(--space-6); border-radius: var(--radius-pill); background: var(--amber); color: var(--on-amber); font: 500 13px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; transition: transform 160ms cubic-bezier(0.2,0,0,1), background-color 120ms cubic-bezier(0.2,0,0,1); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--mist); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--amber-deep); } }
  .offices { display: grid; gap: var(--space-6); border-left: 1px solid rgba(179,207,234,0.35); padding-left: var(--space-8); }
  .office span { display: block; font: 400 14px/1.45 var(--font-sans); color: var(--mist); }
  .office a { font: 500 19px/1.35 var(--font-sans); color: var(--on-navy); text-decoration: none; font-variant-numeric: tabular-nums; }
  .office a:focus-visible { outline: 2px solid var(--mist); outline-offset: 2px; }
  .office small { display: block; font: 400 14px/1.45 var(--font-sans); color: var(--mist); }
</style>
</head>
<body>
  <section class="band">
    <div>
      <span class="eyebrow">New patients welcome</span>
      <h2 class="h2">Ready to see your best?</h2>
      <a class="btn" href="#">Schedule Appointment</a>
    </div>
    <div class="offices">
      <div class="office">
        <span>Sacramento office</span>
        <a href="#">916-452-8105</a>
        <small>4925 J Street · Mon to Fri, 8:00am to 5:00pm</small>
      </div>
      <div class="office">
        <span>Folsom office</span>
        <a href="#">916-983-9823</a>
        <small>2160 E Bidwell Street · Mon to Thu, 8:00am to 4:30pm · Fri, 6:30am to 2:00pm</small>
      </div>
    </div>
  </section>
</body>
</html>
